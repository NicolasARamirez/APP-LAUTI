<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131c1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lauti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<title>Lauti</title>
<style>
:root{
  color-scheme: dark;
  --bg:#131c1b;
  --surface:#1b2726;
  --raised:#243332;
  --line:#2f403e;
  --ink:#e9f0ee;
  --muted:#8ea29e;
  --faint:#5f726e;
  --in:#3f8fe8;
  --in-text:#9cc6f6;
  --out:#e06a35;
  --out-text:#f2a27c;
  --ok:#4fc392;
  --danger:#e66767;
  --display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--in-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
header.top h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 10px 6px 8px;border-radius:999px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:block}
.sync.ok i{background:var(--ok)}.sync.pend i{background:#e8b23d}.sync.err i{background:var(--danger)}
.sync svg{width:18px;height:18px;opacity:.8}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.view{display:none}.view.on{display:block}
#v-cargar.on{display:flex;flex-direction:column;min-height:100%;padding-bottom:0}

nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--faint)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--in);color:#06121f;font-size:11px;font-weight:700;line-height:17px}

.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{padding:7px 13px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.seg.tipo button[data-v="gasto"][aria-pressed="true"]{background:var(--out);color:#1a0d06}
.seg.tipo button[data-v="ingreso"][aria-pressed="true"]{background:var(--in);color:#06121f}
.seg.tipo button[data-v="transferencia"][aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* cargar */
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
.c-top .seg button{padding:7px 11px}
.amount{font-family:var(--display);font-weight:500;font-size:clamp(42px,13vw,60px);letter-spacing:-.02em;text-align:center;padding:10px 0 2px;line-height:1.05;white-space:nowrap;overflow:hidden}
.amount .cur{font-size:.45em;color:var(--muted);margin-right:.18em;vertical-align:.35em}
.amount.empty{color:var(--faint)}
.hint{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-bottom:8px;padding:0 8px}
.hint.err{color:var(--danger)}
.chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;justify-content:start}
.chips::-webkit-scrollbar{display:none}
.chips.one{grid-template-rows:auto}
.chip{position:relative;white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--raised)}
.chip.mut{color:var(--muted)}
.chip.on{color:var(--ink);border-color:var(--line)}
.chip.card::before{content:"";width:12px;height:9px;border-radius:2px;border:1.5px solid currentColor;opacity:.7}
.chip small{color:var(--muted);font-size:12px}
.chip input,.chip select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.chip svg{width:16px;height:16px;opacity:.75}
.lbl{font-size:12px;color:var(--faint);margin:10px 0 6px}
.nota{width:100%;background:var(--surface);border:1px solid transparent;border-radius:999px;padding:8px 14px;font-size:16px;outline:none;margin-top:8px}
.nota:focus{border-color:var(--line)}
.amt2{white-space:nowrap;display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--muted)}
.amt2 input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;font-size:16px;outline:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:12px}
.pad button{height:48px;border-radius:var(--r-m);background:var(--surface);font-family:var(--display);font-size:23px;font-weight:500}
.pad button:active{background:var(--raised)}
.pad button svg{width:26px;height:26px;vertical-align:middle}
.save{margin:8px 0 12px;height:52px;border-radius:var(--r-m);font-weight:600;font-size:17px;width:100%;background:var(--out);color:#1a0d06}
.save.ingreso{background:var(--in);color:#06121f}
.save.transferencia{background:var(--ink);color:var(--bg)}
.save:disabled{background:var(--surface);color:var(--faint)}

/* bloques */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:8px}
.mhead .mname{font-family:var(--display);font-size:20px;font-weight:500;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.35}
.hero{background:var(--surface);border-radius:var(--r-l);padding:18px 18px 16px}
.hero .k,.k{font-size:13px;color:var(--muted)}
.hero .big{font-family:var(--display);font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:2px 0 14px}
.hero .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.hero .pair b{display:block;font-weight:600;font-size:17px}
.hero .foot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px;color:var(--muted)}
.hero .foot b{color:var(--in-text);font-weight:600}
.neg{color:var(--danger)}
h2{font-family:var(--display);font-weight:500;font-size:18px;margin:26px 0 10px}
.catbars{display:flex;flex-direction:column;gap:12px}
.cb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.cb-top span:last-child{color:var(--muted);white-space:nowrap}
.cb-top b{font-weight:600;color:var(--ink)}
.cb-track{height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.cb-fill{height:100%;background:var(--out);border-radius:0 4px 4px 0;min-width:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.tag b{font-weight:600;margin-left:6px}
.day{font-size:13px;color:var(--muted);margin:18px 0 4px}
.mov{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mov .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--out)}
.mov .dot.ingreso,.mov .dot.reintegro{background:var(--in)}
.mov .dot.transferencia{background:transparent;border:1.5px solid var(--muted)}
.mov .t{flex:1;min-width:0}
.mov .t b{display:block;font-weight:500;font-size:15px}
.mov .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .a{font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.mov .a small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mov .a.ingreso,.mov .a.reintegro{color:var(--in-text)}
.mov .a.transferencia{color:var(--muted);font-weight:500}
.empty-st{background:var(--surface);border-radius:var(--r-m);padding:22px 18px;color:var(--muted);font-size:15px;text-align:center}
.empty-st button{margin-top:12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* cuentas */
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.acc:last-of-type{border-bottom:0}
.acc .t{flex:1;min-width:0}.acc .t b{font-weight:500;display:block}.acc .t small{color:var(--muted);font-size:13px}
.acc .a{font-weight:600;white-space:nowrap}
.tarj{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px}
.tarj .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.tarj .h b{font-weight:600;font-size:16px}
.tarj .h small{color:var(--muted);font-size:13px}
.tarj .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tarj .r span:first-child{color:var(--muted)}
.tarj .r span:last-child{white-space:nowrap;text-align:right}
.tarj .r small{display:block}
.tarj .r b{font-weight:600}
.tarj .r .pg{color:var(--ok);font-size:12px;font-weight:500}
.fijo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--surface);border-radius:var(--r-m);margin-bottom:8px}
.fijo .t{flex:1;min-width:0}.fijo .t b{display:block;font-weight:500}.fijo .t small{color:var(--muted);font-size:13px}
.fijo.off{opacity:.5}
.addbtn{width:100%;padding:13px;border-radius:var(--r-m);border:1px dashed var(--line);color:var(--muted);font-size:15px;margin-top:6px}
.note{font-size:13px;color:var(--faint);margin:12px 2px 0;line-height:1.5}

/* resumenes de tarjeta (hoja) */
.res{border-top:1px solid var(--line);padding:12px 0}
.res .rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.res .rh b{font-weight:600;text-transform:capitalize}
.res .rh small{display:block;color:var(--muted);font-size:13px}
.res .rh .tot{text-align:right;font-weight:600;white-space:nowrap}
.res .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.res .acts button{padding:7px 12px;border-radius:999px;background:var(--raised);font-size:13px}
.res .acts button.pri{background:var(--ink);color:var(--bg);font-weight:600}
.res .items{margin-top:8px;font-size:13px}
.res .items div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;color:var(--muted)}
.res .items div span:last-child{color:var(--ink);white-space:nowrap}
.res .fechas{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
.res .fechas label{font-size:12px;color:var(--muted)}
.res .fechas input{width:100%;background:var(--raised);border:0;border-radius:var(--r-s);padding:9px;font-size:15px;margin-top:4px}
.res .fechas button{padding:9px 12px;border-radius:var(--r-s);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}

/* me deben */
.per{background:var(--surface);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px}
.per .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.per .h b{font-weight:600;font-size:17px}
.per .h .tot{font-weight:600;color:var(--in-text);white-space:nowrap;text-align:right}
.per .it{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.per .it span:first-child{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.per .it span:last-child{white-space:nowrap}
.per .cobrar{margin-top:10px;width:100%;padding:11px;border-radius:var(--r-s);background:var(--in);color:#06121f;font-weight:600}

/* historial */
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.readout{min-height:40px;font-size:14px;margin-bottom:4px}
.readout b{font-weight:600}
.readout .m{color:var(--muted);text-transform:capitalize}
#chart{width:100%;height:auto;display:block;touch-action:pan-y}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart text{fill:var(--faint);font-size:10px;font-family:var(--body)}
#chart .xl{text-anchor:middle;text-transform:capitalize}
#chart .xl.sel{fill:var(--ink);font-weight:600}
#chart .hit{fill:transparent;cursor:pointer}
#chart .selbg{fill:var(--surface)}
table.ht{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.ht th{font-weight:500;color:var(--faint);text-align:right;padding:6px 0 6px 6px;border-bottom:1px solid var(--line)}
table.ht th:first-child,table.ht td:first-child{text-align:left;padding-left:0}
table.ht td{text-align:right;padding:9px 0 9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.ht td:first-child{text-transform:capitalize;color:var(--muted)}
table.ht td small{display:block;font-size:11px;color:var(--faint)}
table.ht td small.up{color:var(--out-text)} table.ht td small.down{color:var(--in-text)}

/* hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,10,.6);display:none;z-index:20}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92dvh;overflow-y:auto;z-index:21;transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-x{position:absolute;top:12px;right:14px;width:34px;height:34px;background:var(--raised)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 14px;padding-right:44px}
.sheet h4{font-weight:600;font-size:15px;margin:18px 0 8px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--raised);border:1px solid transparent;border-radius:var(--r-s);padding:11px 12px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--muted)}
.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.f small{display:block;font-size:12px;color:var(--faint);margin-top:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--in)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.btn{height:50px;border-radius:var(--r-m);font-weight:600;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.status{font-size:14px;color:var(--muted);margin:2px 0 12px;min-height:20px}
.status.err{color:var(--danger)}
details.help{background:var(--raised);border-radius:var(--r-s);padding:10px 12px;margin-bottom:14px;font-size:14px;color:var(--muted)}
details.help summary{color:var(--ink);cursor:pointer}
details.help ol{padding-left:20px;margin:8px 0 2px}

/* editor de compartidos */
.deb .drow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:8px;align-items:center}
.deb .drow input{width:100%;background:var(--raised);border:1px solid transparent;border-radius:var(--r-s);padding:10px 11px;font-size:16px;outline:none}
.deb .drow input:focus{border-color:var(--muted)}
.deb .drow button{width:34px;height:34px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
.deb .drow button svg{width:16px;height:16px}
.deb .addp{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.deb .addp button{padding:7px 12px;border-radius:999px;background:var(--raised);font-size:14px}
.deb .addp button.new{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.deb .mine{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:10px 0;border-top:1px solid var(--line)}
.deb .mine b{font-weight:600}
.deb .mine button{padding:7px 12px;border-radius:999px;background:var(--raised);font-size:13px}
.deb .err{color:var(--danger);font-size:13px;min-height:18px}

.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 56px);max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r-m);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;z-index:30;opacity:0;transform:translateY(-8px);box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{font-weight:700;color:var(--bg);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="title">Cargar</h1>
    <button class="sync" id="syncBtn" aria-label="Sincronización y ajustes"><i></i><span id="syncTxt">Sin conectar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="view on" id="v-cargar"></section>
    <section class="view" id="v-mes"></section>
    <section class="view" id="v-cuentas"></section>
    <section class="view" id="v-deben"></section>
    <section class="view" id="v-hist"></section>
  </main>

  <nav class="tabs" aria-label="Secciones">

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn" hidden>Deshacer</button></div>

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const ymOf = iso => String(iso).slice(0, 7);
const curYM = () => ymOf(todayISO());
const daysIn = (y, m) => new Date(y, m, 0).getDate();
function addMonthsYM(ym, n){ let [y,m] = ym.split('-').map(Number); m += n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad2(m)}`; }
function dateIn(ym, day){ const [y,m] = ym.split('-').map(Number); return `${ym}-${pad2(Math.min(Math.max(1, day), daysIn(y,m)))}`; }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const mesNombre = ym => MESES[Number(ym.slice(5))-1];
const ymLabel = ym => `${mesNombre(ym)} ${ym.slice(0,4)}`;
const ymShort = ym => mesNombre(ym).slice(0,3);
const nf = new Intl.NumberFormat('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const sym = cur => cur === 'USD' ? 'US$' : '$';
function money(n, cur){ const s = n < -0.004 ? '−' : ''; return `${s}${sym(cur)} ${nf.format(Math.abs(r2(n)))}`; }
function compact(n){ const a = Math.abs(n); if(a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' M'; if(a >= 1e3) return Math.round(n/1e3)+' k'; return String(Math.round(n)); }
function parseAmount(str){
  let s = String(str ?? '').trim().replace(/[^\d.,-]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
  return Number(s);
}
function fechaCorta(iso){
  if(iso === todayISO()) return 'Hoy';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(iso === isoOf(y)) return 'Ayer';
  const [yy,mm,dd] = iso.split('-').map(Number);
  return `${dd} ${MESES[mm-1].slice(0,3)}${yy !== new Date().getFullYear() ? ' '+yy : ''}`;
}
const diaMes = iso => { const [,m,d] = iso.split('-').map(Number); return `${d} ${MESES[m-1].slice(0,3)}`; };
const ICON = {
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  ppl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.7-4.7 5.5-4.7s4.9 1.7 5.5 4.7"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.4c2.3.1 4 1.6 4.5 4.6"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>',
};

/* =========================================================
   Datos: tablas locales + cola para la planilla
   ========================================================= */
const TABLES = ['mov','fijo','cuenta','cierre','cfg'];
const MOV_COLS = ['id','fecha','mes','tipo','monto','moneda','categoria','cuenta','cuentaDestino','montoDestino','monedaDestino','miParte','deben','vinculo','persona','etiquetas','nota','cuota','compraId','fijoId'];
const DEF = {
  catsGasto:['Supermercado','Alquiler y expensas','Servicios','Transporte','Comida afuera','Salidas','Deportes','Ropa','Salud','Suscripciones','Tecnología','Productora','Trabajo','Regalos','Otros gastos'],
  catsIngreso:['Sueldo y comisiones','Productora','Otros ingresos'],
};
const SEEDS = [
  {id:'c_efectivo',    nombre:'Efectivo',            clase:'cuenta',  moneda:'ARS', orden:1},
  {id:'c_supervielle', nombre:'Supervielle',         clase:'cuenta',  moneda:'ARS', orden:2},
  {id:'c_santander',   nombre:'Santander',           clase:'cuenta',  moneda:'ARS', orden:3},
  {id:'c_mp',          nombre:'Mercado Pago',        clase:'cuenta',  moneda:'ARS', orden:4},
  {id:'c_usd',         nombre:'Dólares',             clase:'cuenta',  moneda:'USD', orden:5},
  {id:'t_supervielle', nombre:'Crédito Supervielle', clase:'tarjeta', moneda:'ARS', orden:6, cierreDia:25, vencDia:7},
  {id:'t_santander',   nombre:'Crédito Santander',   clase:'tarjeta', moneda:'ARS', orden:7, cierreDia:25, vencDia:7},
];
function load(key, def){ try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? def; }catch(e){ return def; } }
function store(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }
let conn = Object.assign({url:'', token:''}, load('lauti.conn', {}));
let db = Object.assign({mov:{}, fijo:{}, cuenta:{}, cierre:{}, cfg:{}, borrados:{}, queue:[], lastSync:null, syncErr:null}, load('lauti.db', {}));
TABLES.forEach(t => { db[t] = db[t] || {}; });
function saveDB(){ try{ localStorage.setItem('lauti.db', JSON.stringify(db)); }catch(e){ toast('No hay espacio para guardar en este teléfono'); } }

function enqueue(op){
  const key = o => o.t + ':' + (o.op === 'put' ? o.row.id : o.id);
  const k = key(op);
  db.queue = db.queue.filter(q => key(q) !== k);
  db.queue.push(op);
}
function put(t, row){ row = {...row, actualizado:new Date().toISOString()}; db[t][row.id] = row; if(t === 'mov') delete db.borrados[row.id]; enqueue({op:'put', t, row}); return row; }
function del(t, id){ delete db[t][id]; if(t === 'mov') db.borrados[id] = 1; enqueue({op:'del', t, id}); }
function commit(){ saveDB(); renderAll(); scheduleSync(); }

function normRow(t, r){
  const o = {...r}; o.id = String(o.id);
  for(const k of ['monto','montoDestino','miParte','saldoInicial','dia','cierreDia','vencDia','orden']) if(k in o) o[k] = Number(o[k]) || 0;
  if('activo' in o) o.activo = o.activo === true || String(o.activo).toUpperCase() === 'TRUE';
  for(const k of ['fecha','cierre','vencimiento']) if(o[k]) o[k] = String(o[k]).slice(0,10);
  if(o.desde) o.desde = String(o.desde).slice(0, t === 'fijo' ? 7 : 10);
  if(o.mes) o.mes = String(o.mes).slice(0,7);
  for(const k of Object.keys(o)) if(o[k] == null) o[k] = '';
  return o;
}

/* config compartida (categorías) */
function getCfg(k, def){ const r = db.cfg[k]; if(!r) return def; try{ const v = JSON.parse(r.valor); return v ?? def; }catch(e){ return def; } }
function setCfg(k, v){ put('cfg', {id:k, valor:JSON.stringify(v)}); }
const catsGasto = () => getCfg('catsGasto', DEF.catsGasto);
const catsIngreso = () => getCfg('catsIngreso', DEF.catsIngreso);

/* cuentas */
const cuentasActivas = () => Object.values(db.cuenta).filter(c => c.activo).sort((a,b) => (a.orden - b.orden) || a.nombre.localeCompare(b.nombre));
const esTarjeta = id => db.cuenta[id] && db.cuenta[id].clase === 'tarjeta';
const nombreCuenta = id => db.cuenta[id] ? db.cuenta[id].nombre : 'Cuenta borrada';
function seed(){
  if(Object.keys(db.cuenta).length) return 0;
  const hoy = todayISO();
  SEEDS.forEach(s => put('cuenta', {saldoInicial:0, desde:hoy, cierreDia:0, vencDia:0, activo:true, ...s}));
  return 1;
}

/* tarjetas: cierre, vencimiento y a qué resumen va cada compra.
   Un resumen se identifica por el mes en que vence (el mes en que lo pagás). */
function cierreVenc(card, R){
  const o = db.cierre[card.id + '_' + R];
  const cd = Number(card.cierreDia) || 25, vd = Number(card.vencDia) || 7;
  const cierreYM = vd > cd ? R : addMonthsYM(R, -1);
  return { cierre: (o && o.cierre) || dateIn(cierreYM, cd), venc: (o && o.vencimiento) || dateIn(R, vd), manual: !!o };
}
function resumenDe(cardId, fecha){
  const card = db.cuenta[cardId]; if(!card) return ymOf(fecha);
  let R = addMonthsYM(ymOf(fecha), -1);
  for(let i = 0; i < 6; i++){ if(fecha <= cierreVenc(card, R).cierre) return R; R = addMonthsYM(R, 1); }
  return R;
}
function calcMes(m){
  if(m.tipo === 'transferencia' && esTarjeta(m.cuentaDestino)) return m.mes || addMonthsYM(resumenDe(m.cuentaDestino, m.fecha), -1);
  if(m.tipo === 'gasto' && esTarjeta(m.cuenta)){
    const k = m.cuota ? (Number(String(m.cuota).split('/')[0]) || 1) - 1 : 0;
    return addMonthsYM(resumenDe(m.cuenta, m.fecha), k);
  }
  return ymOf(m.fecha);
}
function recomputeMes(){
  let n = 0;
  for(const m of Object.values(db.mov)){ const x = calcMes(m); if(x !== m.mes){ put('mov', {...m, mes:x}); n++; } }
  return n;
}

/* movimientos */
const debenDe = m => { try{ const a = Array.isArray(m.deben) ? m.deben : (m.deben ? JSON.parse(m.deben) : []); return Array.isArray(a) ? a.filter(x => x && x.p && Number(x.m) > 0).map(x => ({p:String(x.p), m:r2(x.m)})) : []; }catch(e){ return []; } };
const tagsDe = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
function mkMov(f){
  const m = {}; MOV_COLS.forEach(k => m[k] = ''); Object.assign(m, f);
  m.monto = r2(m.monto); m.montoDestino = r2(m.montoDestino);
  if(m.tipo === 'gasto'){ const d = debenDe(m); m.deben = d.length ? JSON.stringify(d) : ''; m.miParte = r2(m.monto - d.reduce((s,x) => s + x.m, 0)); }
  else { m.deben = ''; m.miParte = 0; }
  if(m.tipo !== 'transferencia'){ m.cuentaDestino = ''; m.montoDestino = 0; m.monedaDestino = ''; }
  if(Array.isArray(m.etiquetas)) m.etiquetas = m.etiquetas.join(', ');
  m.mes = calcMes(m);
  return m;
}
const putMov = f => put('mov', mkMov(f));

/* deudas: lo que te deben, por gasto y persona */
function pendientes(){
  const cob = {};
  for(const m of Object.values(db.mov)) if(m.tipo === 'reintegro'){ const k = m.vinculo + '|' + m.persona; cob[k] = r2((cob[k] || 0) + m.monto); }
  const out = [];
  for(const m of Object.values(db.mov)) if(m.tipo === 'gasto') for(const d of debenDe(m)){
    const c = cob[m.id + '|' + d.p] || 0;
    out.push({mov:m, persona:d.p, total:d.m, cobrado:c, pend:r2(Math.max(0, d.m - c)), moneda:m.moneda});
  }
  return out;
}
function deudores(cur){
  const by = {};
  for(const x of pendientes()) if(x.pend > 0.004 && (!cur || x.moneda === cur)){ by[x.persona] = by[x.persona] || {ARS:0, USD:0, items:[]}; by[x.persona][x.moneda] = r2(by[x.persona][x.moneda] + x.pend); by[x.persona].items.push(x); }
  return by;
}
function registrarCobro({persona, moneda, monto, cuenta, fecha}){
  let rest = r2(monto); const ids = [];
  const items = pendientes().filter(x => x.persona === persona && x.moneda === moneda && x.pend > 0.004).sort((a,b) => a.mov.fecha.localeCompare(b.mov.fecha));
  for(const it of items){
    if(rest <= 0.004) break;
    const a = r2(Math.min(rest, it.pend)), id = uid();
    putMov({id, tipo:'reintegro', fecha, monto:a, moneda, cuenta, categoria:'Cobro', vinculo:it.mov.id, persona, nota: it.mov.nota || it.mov.categoria});
    ids.push(id); rest = r2(rest - a);
  }
  return ids;
}
function personasConocidas(){
  const f = {};
  for(const m of Object.values(db.mov)) for(const d of debenDe(m)) f[d.p] = (f[d.p] || 0) + 1;
  for(const x of Object.values(db.fijo)) for(const d of debenDe(x)) f[d.p] = (f[d.p] || 0) + 1;
  return Object.keys(f).sort((a,b) => f[b] - f[a] || a.localeCompare(b));
}
function tagsConocidas(){
  const f = {};
  for(const m of Object.values(db.mov)) for(const t of tagsDe(m.etiquetas)) f[t] = (f[t] || 0) + 1;
  return Object.keys(f).sort((a,b) => f[b] - f[a] || a.localeCompare(b));
}

/* saldos */
function saldo(c){
  let s = Number(c.saldoInicial) || 0; const d = c.desde || '';
  for(const m of Object.values(db.mov)){
    if(m.fecha < d) continue;
    if(m.cuenta === c.id) s += (m.tipo === 'ingreso' || m.tipo === 'reintegro') ? m.monto : -m.monto;
    if(m.tipo === 'transferencia' && m.cuentaDestino === c.id) s += (m.montoDestino || m.monto);
  }
  return r2(s);
}
function resumenTarjeta(card, R){
  const o = {ARS:0, USD:0, pagos:{ARS:0, USD:0}, items:[], ...cierreVenc(card, R), R};
  for(const m of Object.values(db.mov)){
    if(m.mes !== R) continue;
    if(m.tipo === 'gasto' && m.cuenta === card.id){ o[m.moneda] = r2(o[m.moneda] + m.monto); o.items.push(m); }
    if(m.tipo === 'transferencia' && m.cuentaDestino === card.id) o.pagos[m.moneda] = r2(o.pagos[m.moneda] + m.monto);
  }
  o.items.sort((a,b) => a.fecha.localeCompare(b.fecha));
  return o;
}

/* totales por mes (gastos = tu parte) */
function totales(ym, cur){
  let ing = 0, gas = 0;
  for(const m of Object.values(db.mov)){
    if(m.mes !== ym || m.moneda !== cur) continue;
    if(m.tipo === 'gasto') gas += m.miParte;
    if(m.tipo === 'ingreso') ing += m.monto;
  }
  return {ing:r2(ing), gas:r2(gas), saldo:r2(ing - gas)};
}

/* fijos: se cargan solos */
function genFijos(){
  const today = todayISO(), cym = ymOf(today), dHoy = Number(today.slice(8));
  let n = 0;
  for(const f of Object.values(db.fijo)){
    if(!f.activo || !f.desde || !db.cuenta[f.cuenta]) continue;
    for(let ym = f.desde, g = 0; ym <= cym && g < 36; ym = addMonthsYM(ym, 1), g++){
      const fecha = dateIn(ym, Number(f.dia) || 1);
      if(ym === cym && Number(fecha.slice(8)) > dHoy) continue;
      const id = `fx_${f.id}_${ym}`;
      if(db.mov[id] || db.borrados[id]) continue;
      putMov({id, fecha, tipo:f.tipo, monto:f.monto, moneda:f.moneda, categoria:f.categoria, cuenta:f.cuenta, deben:f.tipo === 'gasto' ? debenDe(f) : [], etiquetas:f.etiquetas, nota:f.nombre, fijoId:f.id});
      n++;
    }
  }
  return n;
}
function mantenimiento(){ return seed() + genFijos() + recomputeMes(); }

/* =========================================================
   Sincronización
   ========================================================= */
let syncing = false, syncTimer = null, firstSyncDone = false;
function scheduleSync(ms = 1200){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), ms); }
async function sync(opts = {}){
  if(syncing) return {ok:false, error:'Ya se está sincronizando'};
  if(!conn.url || !conn.token){ renderSync(); return {ok:false, error:'Falta la dirección del script o la clave'}; }
  if(!navigator.onLine){ renderSync(); return {ok:false, error:'Sin conexión: los cambios quedan guardados en el teléfono'}; }
  syncing = true; renderSync();
  const post = async body => { const res = await fetch(conn.url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:conn.token, ...body})}); const d = await res.json(); if(!d.ok) throw new Error(d.error || 'Error del script'); return d; };
  try{
    if(!db.lastSync){
      // primera vez en este teléfono: si la planilla ya tiene cuentas y categorías, mandan las de la planilla
      const probe = await post({ops:[]});
      const ids = {cuenta:new Set((probe.cuenta || []).map(r => String(r.id))), cfg:new Set((probe.cfg || []).map(r => String(r.id)))};
      db.queue = db.queue.filter(q => !(q.op === 'put' && ids[q.t] && ids[q.t].has(String(q.row.id))));
    }
    const sent = db.queue.slice();
    const data = await post({ops:sent, rebuild:!!opts.rebuild});
    const pending = db.queue.filter(q => !sent.includes(q));
    TABLES.forEach(t => { db[t] = {}; (data[t] || []).forEach(r => { const o = normRow(t, r); db[t][o.id] = o; }); });
    db.borrados = {}; (data.borrados || []).forEach(id => db.borrados[id] = 1);
    db.queue = [];
    for(const q of pending){
      if(q.op === 'put'){ db[q.t][q.row.id] = q.row; if(q.t === 'mov') delete db.borrados[q.row.id]; }
      else { delete db[q.t][q.id]; if(q.t === 'mov') db.borrados[q.id] = 1; }
      db.queue.push(q);
    }
    db.lastSync = new Date().toISOString(); db.syncErr = null; firstSyncDone = true;
    const changed = mantenimiento();
    saveDB(); syncing = false; renderAll();
    if(db.queue.length || changed) scheduleSync(300);
    return {ok:true};
  }catch(e){
    db.syncErr = navigator.onLine ? (e.message || 'No se pudo conectar') : null;
    saveDB(); syncing = false; renderSync();
    return {ok:false, error: db.syncErr || 'Sin conexión'};
  }
}
function renderSync(){
  const b = $('#syncBtn'), t = $('#syncTxt'), n = db.queue.length;
  b.className = 'sync';
  if(!conn.url || !conn.token) t.textContent = 'Sin conectar';
  else if(syncing){ t.textContent = 'Subiendo…'; b.classList.add('pend'); }
  else if(db.syncErr){ t.textContent = 'Error'; b.classList.add('err'); }
  else if(n){ t.textContent = `${n} sin subir`; b.classList.add('pend'); }
  else { t.textContent = 'Al día'; b.classList.add('ok'); }
}
window.addEventListener('online', () => sync());
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ if(mantenimiento()) commit(); else sync(); } });

/* =========================================================
   Toast, hoja inferior, navegación
   ========================================================= */
let toastTimer, toastUndo;
function toast(msg, undo){
  $('#toastTxt').textContent = msg; toastUndo = undo; $('#toastBtn').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), undo ? 5000 : 2600);
}
$('#toastBtn').onclick = () => { if(toastUndo) toastUndo(); $('#toast').classList.remove('on'); };

function openSheet(html){
  const s = $('#sheet');
  s.innerHTML = `<div class="grab"></div><button class="iconbtn sheet-x" id="sheetClose" aria-label="Cerrar">${ICON.x}</button>` + html;
  $('#sheetClose').onclick = closeSheet;

/* =========================================================
   Editor de compartidos (reusable)
   state = {list:[{p,m}], total:()=>number, cur}
   ========================================================= */
function debenEditor(el, state){
  const sum = () => r2(state.list.reduce((s,x) => s + (Number(x.m) || 0), 0));
  function upd(){
    const t = state.total(), mine = r2(t - sum());
    el.querySelector('.mineV').textContent = money(mine, state.cur);
    el.querySelector('.err').textContent = t > 0 && mine < -0.004 ? 'Lo que te deben supera el total' : '';
  }
  function draw(){
    const known = personasConocidas().filter(p => !state.list.some(x => x.p === p)).slice(0, 12);
    el.innerHTML = `
      ${state.list.map((x, i) => `<div class="drow" data-i="${i}">
        <input class="dp" value="${esc(x.p)}" placeholder="Nombre" autocomplete="off" aria-label="Nombre">
        <input class="dm num" value="${x.m ? nf.format(x.m) : ''}" placeholder="0" inputmode="decimal" aria-label="Monto que te debe">
        <button class="rm" aria-label="Quitar">${ICON.x}</button></div>`).join('')}
      <div class="addp">${known.map(p => `<button data-p="${esc(p)}">+ ${esc(p)}</button>`).join('')}<button class="new">+ Otra persona</button></div>
      <div class="mine"><span>Tu parte <b class="num mineV"></b></span>${state.list.length ? '<button class="eq">Dividir en partes iguales</button>' : ''}</div>
      <div class="err"></div>`;
    el.querySelectorAll('.drow').forEach(r => {
      const i = Number(r.dataset.i);
      r.querySelector('.dp').oninput = e => { state.list[i].p = e.target.value.trim(); };
      r.querySelector('.dm').oninput = e => { state.list[i].m = r2(parseAmount(e.target.value)) || 0; upd(); };
      r.querySelector('.rm').onclick = () => { state.list.splice(i, 1); draw(); };
    });
    el.querySelectorAll('.addp [data-p]').forEach(b => b.onclick = () => { state.list.push({p:b.dataset.p, m:0}); equal(); });
    el.querySelector('.addp .new').onclick = () => { state.list.push({p:'', m:0}); equal(); setTimeout(() => { const ins = el.querySelectorAll('.dp'); ins[ins.length-1]?.focus(); }, 30); };
    const eq = el.querySelector('.eq'); if(eq) eq.onclick = equal;
    upd();
  }
  function equal(){
    const t = state.total(), n = state.list.length + 1;
    if(t > 0){ const each = Math.floor(t / n * 100) / 100; state.list.forEach(x => x.m = each); }
    draw();
  }
  draw();
  return { valid(){ const t = state.total(); return state.list.every(x => !x.m || x.p) && r2(t - sum()) >= -0.004; }, clean(){ return state.list.filter(x => x.p && x.m > 0).map(x => ({p:x.p, m:r2(x.m)})); } };
}

function validar(){
  const val = amtValue();
  if(!(val > 0)) return {ok:false, hint:''};
  if(!form.cuenta) return {ok:false, hint:'Elegí una cuenta'};
  if(form.tipo === 'gasto'){
    if(!form.cat) return {ok:false, hint:'Elegí una categoría'};
    const deb = r2(form.deben.reduce((s,x) => s + x.m, 0));
    if(deb > val + 0.004) return {ok:false, hint:'Lo que te deben supera el total', err:true};
    const parts = [];
    if(deb > 0) parts.push(`Tu parte ${money(val - deb, form.cur)}, te deben ${money(deb, form.cur)}`);
    if(form.cuotas > 1) parts.push(`${form.cuotas} cuotas de ${money(val / form.cuotas, form.cur)}`);
    if(esTarjeta(form.cuenta)){ const R = resumenDe(form.cuenta, form.fecha); parts.push(form.cuotas > 1 ? `desde el resumen de ${mesNombre(R)}` : `Va al resumen de ${mesNombre(R)}`); }
    return {ok:true, hint:parts.join('. ').replace('. desde', ' desde')};
  }
  if(form.tipo === 'ingreso'){
    if(form.cobroDe){
      const max = deudores(form.cur)[form.cobroDe][form.cur];
      if(val > max + 0.004) return {ok:false, hint:`${form.cobroDe} te debe ${money(max, form.cur)} como máximo`, err:true};
      return {ok:true, hint:`Se descuenta de lo que te debe ${form.cobroDe}. No suma como ingreso`};
    }
    if(!form.cat) return {ok:false, hint:'Elegí una categoría'};
    return {ok:true, hint:''};
  }
  if(!form.destino) return {ok:false, hint:'Elegí a qué cuenta va'};
  if(crossCurrency() && !(parseAmount(form.amt2) > 0)) return {ok:false, hint:`Poné cuánto recibís en ${db.cuenta[form.destino].moneda}`};
  if(esTarjeta(form.destino)){ const R = form.pagoR || addMonthsYM(resumenDe(form.destino, form.fecha), -1); return {ok:true, hint:`Pago del resumen de ${mesNombre(R)} ${R.slice(0,4)}`}; }
  return {ok:true, hint:'No cuenta como gasto'};
}

function guardar(){
  if(!validar().ok) return;
  const total = amtValue(), ids = [];

    const n = form.cuotas;
    if(n > 1){
      const compraId = uid(), cuota = Math.floor(total / n * 100) / 100, first = r2(total - cuota * (n - 1));
      for(let i = 0; i < n; i++){
        const id = uid() + i, monto = i === 0 ? first : cuota, f = monto / total;
        putMov({...base, id, tipo:'gasto', categoria:form.cat, monto, cuota:`${i+1}/${n}`, compraId, deben:form.deben.map(x => ({p:x.p, m:r2(x.m * f)}))});

      montoDestino: cross ? r2(parseAmount(form.amt2)) : total, monedaDestino: d.clase === 'tarjeta' ? form.cur : d.moneda, etiquetas:'', mes: d.clase === 'tarjeta' && form.pagoR ? form.pagoR : ''});
    ids.push(id); label = d.clase === 'tarjeta' ? 'Pago de tarjeta guardado' : 'Transferencia guardada';

let mesYM = curYM(), mesCur = 'ARS';
function subDe(m){
  const parts = [];
  if(m.tipo === 'transferencia') parts.push(`${nombreCuenta(m.cuenta)} → ${nombreCuenta(m.cuentaDestino)}`);
  else parts.push(nombreCuenta(m.cuenta));
  if(m.nota && m.tipo !== 'reintegro') parts.unshift(m.nota);
  if(m.tipo === 'reintegro' && m.nota) parts.unshift(m.nota);
  if(m.cuota) parts.push(`cuota ${m.cuota}`);
  if(m.tipo === 'gasto' && esTarjeta(m.cuenta) && ymOf(m.fecha) !== m.mes) parts.push(`compra del ${diaMes(m.fecha)}`);
  if(m.fijoId) parts.push('fijo');
  return parts.join(', ');
}
function movRow(m, pend){
  const titulo = m.tipo === 'transferencia' ? (esTarjeta(m.cuentaDestino) ? 'Pago de tarjeta' : 'Transferencia') : m.tipo === 'reintegro' ? `Cobro de ${m.persona}` : m.categoria;
  let a = money(m.monto, m.moneda), extra = '', share = '';
  if(m.tipo === 'ingreso' || m.tipo === 'reintegro') a = '+' + a;
  if(m.tipo === 'gasto' && m.miParte !== m.monto){
    const p = pend[m.id] || 0;
    a = money(m.miParte, m.moneda);
    extra = `<small>de ${money(m.monto, m.moneda)}</small>`;
    share = p > 0.004 ? `te deben ${money(p, m.moneda)}` : 'ya te pagaron';
  }
  const tags = tagsDe(m.etiquetas);
  const sub = [share, subDe(m)].filter(Boolean).join(', ');
  return `<button class="mov" data-id="${esc(m.id)}"><span class="dot ${m.tipo}"></span>
    <span class="t"><b>${esc(titulo)}</b><small>${esc(sub)}${tags.length ? ' #' + esc(tags.join(' #')) : ''}</small></span>
    <span class="a num ${m.tipo}">${a}${extra}</span></button>`;
}
function pendPorMov(){ const p = {}; for(const x of pendientes()) p[x.mov.id] = r2((p[x.mov.id] || 0) + x.pend); return p; }
function renderMes(){
