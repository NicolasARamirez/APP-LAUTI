  const hasUSD = list.some(m => m.moneda === 'USD');
  if(!hasUSD) mesCur = 'ARS';
  const usa = cur => list.some(m => m.moneda === cur && (m.tipo === 'gasto' || m.tipo === 'ingreso'));
  if(!usa(mesCur) && usa(mesCur === 'ARS' ? 'USD' : 'ARS')) mesCur = mesCur === 'ARS' ? 'USD' : 'ARS';
  const t = totales(mesYM, mesCur), pend = pendPorMov();
  const byCat = {}, byTag = {};
  let teDeben = 0;
  for(const m of list) if(m.moneda === mesCur && m.tipo === 'gasto'){
    byCat[m.categoria] = (byCat[m.categoria] || 0) + m.miParte;
    for(const tg of tagsDe(m.etiquetas)) byTag[tg] = (byTag[tg] || 0) + m.miParte;
    teDeben += pend[m.id] || 0;
  }
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const sorted = list.slice().sort((a,b) => b.fecha.localeCompare(a.fecha) || String(b.actualizado).localeCompare(String(a.actualizado)));
  let lastDay = '', movHTML = '';
  for(const m of sorted){
    if(m.fecha !== lastDay){
      lastDay = m.fecha;
      const d = new Date(m.fecha + 'T12:00');
      const dl = `${DIAS[d.getDay()]} ${d.getDate()}${ymOf(m.fecha) !== mesYM ? ' de ' + MESES[d.getMonth()] : ''}`;
      movHTML += `<div class="day">${dl.charAt(0).toUpperCase() + dl.slice(1)}</div>`;
    }
    movHTML += movRow(m, pend);
  }
  const isCur = mesYM === curYM();
  $('#v-mes').innerHTML = `
    <div class="mhead">
      <button class="iconbtn" id="mPrev" aria-label="Mes anterior">${ICON.prev}</button>
      <span class="mname">${ymLabel(mesYM)}</span>
      <button class="iconbtn" id="mNext" aria-label="Mes siguiente">${ICON.next}</button>
    </div>
    ${hasUSD ? `<div style="margin-bottom:12px" class="seg" id="mesCur"><button data-v="ARS" aria-pressed="${mesCur==='ARS'}">Pesos</button><button data-v="USD" aria-pressed="${mesCur==='USD'}">Dólares</button></div>` : ''}
    ${list.length ? `
    <div class="hero">
      <div class="k">Gastaste${mesYM > curYM() ? ' (cuotas y resúmenes que vienen)' : ''}</div>
      <div class="big num">${money(t.gas, mesCur)}</div>
      <div class="pair">
        <div><span class="k">Ingresos</span><b class="num">${money(t.ing, mesCur)}</b></div>
        <div><span class="k">Te queda</span><b class="num ${t.saldo<0?'neg':''}">${money(t.saldo, mesCur)}</b></div>
      </div>
      ${teDeben > 0.004 ? `<div class="foot">Te deben <b class="num">${money(teDeben, mesCur)}</b> de gastos de este mes</div>` : ''}
    </div>
    ${cats.length ? `<h2>En qué se fue</h2><div class="catbars">${cats.map(([c,val]) => `
      <div><div class="cb-top"><span>${esc(c)}</span><span class="num"><b>${money(val, mesCur)}</b> ${t.gas ? Math.round(val/t.gas*100) : 0}%</span></div>
      <div class="cb-track"><div class="cb-fill" style="width:${Math.max(0, val/max*100).toFixed(1)}%"></div></div></div>`).join('')}</div>` : ''}
    ${Object.keys(byTag).length ? `<h2>Por etiqueta</h2><div class="tags">${Object.entries(byTag).sort((a,b) => b[1]-a[1]).map(([tg,val]) => `<span class="tag">#${esc(tg)}<b class="num">${money(val, mesCur)}</b></span>`).join('')}</div>` : ''}
    <h2>Movimientos</h2>
    <div>${movHTML}</div>
    <p class="note">Los gastos con tarjeta se cuentan en el mes en que vence su resumen.</p>`
    : `<div class="empty-st">No hay movimientos en ${ymLabel(mesYM)}.${isCur ? '<br><button id="goCargar">Cargar el primero</button>' : ''}</div>`}`;
  $('#mPrev').onclick = () => { mesYM = addMonthsYM(mesYM, -1); renderMes(); };
  $('#mNext').onclick = () => { mesYM = addMonthsYM(mesYM, 1); renderMes(); };
  if($('#goCargar')) $('#goCargar').onclick = () => go('cargar');
  $$('#mesCur button').forEach(b => b.onclick = () => { mesCur = b.dataset.v; renderMes(); });
  $$('#v-mes .mov').forEach(b => b.onclick = () => editMov(b.dataset.id));
}

/* editar un movimiento */
function editMov(id){
  const m = db.mov[id]; if(!m) return;
  const grupo = m.compraId ? Object.values(db.mov).filter(x => x.compraId === m.compraId) : [];
  const allAcc = cuentasActivas();
  const accOpts = list => opts(list.concat(db.cuenta[m.cuenta] && !list.includes(db.cuenta[m.cuenta]) ? [db.cuenta[m.cuenta]] : []).map(c => [c.id, c.nombre + (c.clase !== 'tarjeta' && c.moneda === 'USD' ? ' (USD)' : '')]), m.cuenta);
  let body = '', st = null;
  if(m.tipo === 'gasto' || m.tipo === 'ingreso'){
    const cats = m.tipo === 'gasto' ? catsGasto() : catsIngreso();
    const accs = m.tipo === 'gasto' ? allAcc : allAcc.filter(c => c.clase !== 'tarjeta');
    body = `
      <div class="f2">
        <label class="f"><span>Monto${m.cuota ? ' de esta cuota' : ''}</span><input id="eMonto" inputmode="decimal" value="${nf.format(m.monto)}"></label>
        <label class="f"><span>Moneda</span><select id="eCur">${opts(['ARS','USD'], m.moneda)}</select></label>
      </div>
      <label class="f"><span>Categoría</span><select id="eCat">${opts(cats.includes(m.categoria) ? cats : [m.categoria, ...cats], m.categoria)}</select></label>
      <div class="f2">
        <label class="f"><span>${m.tipo === 'gasto' ? 'Con qué pagaste' : 'Dónde entró'}</span><select id="eCuenta">${accOpts(accs)}</select></label>
        <label class="f"><span>Fecha${m.cuota ? ' de compra' : ''}</span><input id="eFecha" type="date" value="${m.fecha}"></label>
      </div>
      <label class="f"><span>Nota</span><input id="eNota" value="${esc(m.nota)}" autocomplete="off"></label>
      <label class="f"><span>Etiquetas (separadas por coma)</span><input id="eTags" value="${esc(m.etiquetas)}" autocomplete="off"></label>
      ${m.tipo === 'gasto' ? '<h4>Compartido</h4><div class="deb" id="eDeb"></div>' : ''}`;
  } else if(m.tipo === 'transferencia'){
    const d = db.cuenta[m.cuentaDestino];
    body = `
      <label class="f"><span>Monto que sale (${m.moneda})</span><input id="eMonto" inputmode="decimal" value="${nf.format(m.monto)}"></label>
      <div class="f2">
        <label class="f"><span>Desde</span><select id="eCuenta">${accOpts(allAcc.filter(c => c.clase !== 'tarjeta' && c.moneda === m.moneda))}</select></label>
        <label class="f"><span>Hacia</span><select id="eDest">${opts(allAcc.filter(c => c.id !== m.cuenta).map(c => [c.id, c.nombre]), m.cuentaDestino)}</select></label>
      </div>
      ${d && d.clase !== 'tarjeta' && d.moneda !== m.moneda ? `<label class="f"><span>Recibiste (${d.moneda})</span><input id="eMonto2" inputmode="decimal" value="${nf.format(m.montoDestino)}"></label>` : ''}
      <label class="f"><span>Fecha</span><input id="eFecha" type="date" value="${m.fecha}"></label>
      <label class="f"><span>Nota</span><input id="eNota" value="${esc(m.nota)}" autocomplete="off"></label>`;
  } else {
    const g = db.mov[m.vinculo];
    body = `
      <p class="k" style="margin:-6px 0 14px">${g ? `Por: ${esc(g.nota || g.categoria)} del ${diaMes(g.fecha)}` : 'El gasto original ya no existe.'}</p>
      <label class="f"><span>Monto</span><input id="eMonto" inputmode="decimal" value="${nf.format(m.monto)}"></label>
      <div class="f2">
        <label class="f"><span>Dónde entró</span><select id="eCuenta">${accOpts(allAcc.filter(c => c.clase !== 'tarjeta' && c.moneda === m.moneda))}</select></label>
        <label class="f"><span>Fecha</span><input id="eFecha" type="date" value="${m.fecha}"></label>
      </div>`;
  }
  const title = {gasto:'Editar gasto', ingreso:'Editar ingreso', transferencia:'Editar transferencia', reintegro:`Cobro de ${esc(m.persona)}`}[m.tipo];
  openSheet(`<h3>${title}${m.cuota ? ` (cuota ${esc(m.cuota)})` : ''}</h3>${body}
    <div class="btns">
      <button class="btn" id="eSave">Guardar cambios</button>
      <button class="btn danger" id="eDel">${m.compraId ? 'Borrar esta cuota' : 'Borrar'}</button>
      ${grupo.length > 1 ? `<button class="btn danger" id="eDelAll">Borrar las ${grupo.length} cuotas</button>` : ''}
    </div>`);
  let ed = null;
  if($('#eDeb')){ st = {list: debenDe(m), total: () => r2(parseAmount($('#eMonto').value)) || 0, cur: m.moneda}; ed = debenEditor($('#eDeb'), st); $('#eMonto').addEventListener('input', () => $('#eDeb .dm')?.dispatchEvent(new Event('input'))); }
  $('#eSave').onclick = () => {
    const monto = r2(parseAmount($('#eMonto').value));
    if(!(monto > 0)){ $('#eMonto').focus(); toast('Revisá el monto'); return; }
    const ch = {...m, monto, fecha: $('#eFecha').value || m.fecha, cuenta: $('#eCuenta').value};
    if($('#eNota')) ch.nota = $('#eNota').value.trim();
    if(m.tipo === 'gasto' || m.tipo === 'ingreso'){
      ch.moneda = $('#eCur').value; ch.categoria = $('#eCat').value; ch.etiquetas = tagsDe($('#eTags').value).join(', ');
      const acc = db.cuenta[ch.cuenta];
      if(acc && acc.clase !== 'tarjeta' && acc.moneda !== ch.moneda){ toast(`${acc.nombre} es una cuenta en ${acc.moneda}`); return; }
      if(ed){ if(!ed.valid()){ toast('Revisá lo compartido'); return; } ch.deben = ed.clean(); }
    }
    if(m.tipo === 'transferencia'){
      ch.cuentaDestino = $('#eDest').value;
      const d = db.cuenta[ch.cuentaDestino];
      ch.monedaDestino = d.clase === 'tarjeta' ? m.moneda : d.moneda;
      ch.montoDestino = $('#eMonto2') ? r2(parseAmount($('#eMonto2').value)) : monto;
    }
    putMov(ch); closeSheet(); commit(); toast('Cambios guardados');
  };
  $('#eDel').onclick = () => { const copy = {...m}; del('mov', id); closeSheet(); commit(); toast('Borrado', () => { put('mov', copy); commit(); }); };
  if($('#eDelAll')) $('#eDelAll').onclick = () => { const copies = grupo.map(x => ({...x})); grupo.forEach(x => del('mov', x.id)); closeSheet(); commit(); toast('Cuotas borradas', () => { copies.forEach(c => put('mov', c)); commit(); }); };
}

/* =========================================================
   Vista: Cuentas (billeteras, tarjetas y fijos)
   ========================================================= */
function renderCuentas(){
  const all = cuentasActivas(), accs = all.filter(c => c.clase !== 'tarjeta'), cards = all.filter(c => c.clase === 'tarjeta');
  const sal = {}; accs.forEach(c => sal[c.id] = saldo(c));
  const totARS = r2(accs.filter(c => c.moneda === 'ARS').reduce((s,c) => s + sal[c.id], 0));
  const totUSD = r2(accs.filter(c => c.moneda === 'USD').reduce((s,c) => s + sal[c.id], 0));
  const hoy = todayISO();
  const fijos = Object.values(db.fijo).sort((a,b) => (b.activo - a.activo) || a.dia - b.dia);
  $('#v-cuentas').innerHTML = `
    <div class="hero">
      <div class="k">Tenés disponible</div>
      <div class="big num" style="margin-bottom:${totUSD ? 4 : 0}px">${money(totARS, 'ARS')}</div>
      ${accs.some(c => c.moneda === 'USD') ? `<div class="num" style="font-size:18px;font-weight:600">${money(totUSD, 'USD')}</div>` : ''}
    </div>
    <h2>Cuentas</h2>
    ${accs.map(c => `<button class="acc" data-acc="${c.id}"><span class="t"><b>${esc(c.nombre)}</b><small>${c.moneda === 'USD' ? 'Dólares' : 'Pesos'}</small></span><span class="a num ${sal[c.id] < 0 ? 'neg' : ''}">${money(sal[c.id], c.moneda)}</span></button>`).join('')}
    <button class="addbtn" id="addAcc">Agregar cuenta</button>
    <p class="note">Tocá una cuenta para poner cuánto tenés hoy. Desde ahí, cada gasto, ingreso y transferencia actualiza el saldo.</p>
    <h2>Tarjetas</h2>
    ${cards.map(c => {
      const Ro = resumenDe(c.id, hoy), Rc = addMonthsYM(Ro, -1);
      const rc = resumenTarjeta(c, Rc), ro = resumenTarjeta(c, Ro);
      const line = (r, lbl) => {
        const tot = [r.ARS ? money(r.ARS, 'ARS') : '', r.USD ? money(r.USD, 'USD') : ''].filter(Boolean).join(' + ') || '<span class="k">Sin consumos</span>';
        const pagado = (r.ARS || r.USD) && r.pagos.ARS + r.pagos.USD > 0 && r.pagos.ARS >= r.ARS - 0.004 && r.pagos.USD >= r.USD - 0.004;
        return `<div class="r"><span>${lbl}</span><span class="num"><b>${tot}</b>${pagado ? '<small class="pg">Pagado</small>' : ''}</span></div>`;
      };
      return `<button class="tarj" data-card="${c.id}">
        <div class="h"><b>${esc(c.nombre)}</b><small>cierra el ${diaMes(ro.cierre)}</small></div>
        ${line(rc, `Resumen de ${mesNombre(Rc)}, ${rc.venc < hoy ? 'venció' : 'vence'} el ${diaMes(rc.venc)}`)}
        ${line(ro, `En curso: resumen de ${mesNombre(Ro)}`)}
      </button>`;
    }).join('')}
    <button class="addbtn" id="addCard">Agregar tarjeta</button>
    <h2>Fijos</h2>
    ${fijos.map(f => `<button class="fijo ${f.activo?'':'off'}" data-fijo="${esc(f.id)}">
      <span class="t"><b>${esc(f.nombre)}</b><small>${f.activo ? `Día ${f.dia}, ${esc(nombreCuenta(f.cuenta))}` : 'Pausado'}${debenDe(f).length ? ', compartido' : ''}</small></span>
      <span class="num" style="font-weight:600;${f.tipo==='ingreso'?'color:var(--in-text)':''}">${f.tipo==='ingreso'?'+':''}${money(f.monto, f.moneda)}</span></button>`).join('')}
    <button class="addbtn" id="addFijo">Agregar gasto o ingreso fijo</button>
    <p class="note">Cada fijo se carga solo el día del mes que elijas. Si el monto cambia, editalo acá y se aplica desde el próximo mes.</p>`;
  $$('#v-cuentas [data-acc]').forEach(b => b.onclick = () => editCuenta(b.dataset.acc));
  $$('#v-cuentas [data-card]').forEach(b => b.onclick = () => openTarjeta(b.dataset.card));
  $$('#v-cuentas [data-fijo]').forEach(b => b.onclick = () => editFijo(b.dataset.fijo));
  $('#addAcc').onclick = () => editCuenta(null, 'cuenta');
  $('#addCard').onclick = () => editCuenta(null, 'tarjeta');
  $('#addFijo').onclick = () => editFijo(null);
}
function editCuenta(id, clase){
  const isNew = !id;
  const c = isNew ? {id:(clase === 'tarjeta' ? 't_' : 'c_') + uid(), nombre:'', clase, moneda:'ARS', saldoInicial:0, desde:todayISO(), cierreDia:25, vencDia:7, orden:Object.keys(db.cuenta).length + 1, activo:true} : {...db.cuenta[id]};
  const tj = c.clase === 'tarjeta';
  openSheet(`<h3>${isNew ? (tj ? 'Nueva tarjeta' : 'Nueva cuenta') : esc(c.nombre)}</h3>
    <label class="f"><span>Nombre</span><input id="cNom" value="${esc(c.nombre)}" placeholder="${tj ? 'Ej: Crédito Galicia' : 'Ej: Brubank'}" autocomplete="off"></label>
    ${tj ? `<div class="f2">
        <label class="f"><span>Día de cierre</span><input id="cCierre" type="number" inputmode="numeric" min="1" max="31" value="${c.cierreDia || 25}"></label>
        <label class="f"><span>Día de vencimiento</span><input id="cVenc" type="number" inputmode="numeric" min="1" max="31" value="${c.vencDia || 7}"></label>
      </div><p class="note" style="margin:-4px 0 14px">Son los días habituales. Si un mes cambian, marcalos en la tarjeta, resumen por resumen.</p>`
    : `<div class="f2">
        <label class="f"><span>Moneda</span><select id="cCur" ${isNew ? '' : 'disabled'}>${opts([['ARS','Pesos'],['USD','Dólares']], c.moneda)}</select></label>
        <label class="f"><span>Saldo hoy</span><input id="cSaldo" inputmode="decimal" value="${isNew ? '' : nf.format(saldo(c))}" placeholder="0"></label>
      </div>`}
    <div class="btns">
      <button class="btn" id="cSave">${isNew ? 'Agregar' : 'Guardar cambios'}</button>
      ${isNew ? '' : `<button class="btn danger" id="cArch">${tj ? 'Quitar tarjeta' : 'Quitar cuenta'}</button>`}
    </div>
    ${isNew ? '' : '<p class="note">Quitarla la oculta de la app; sus movimientos viejos quedan.</p>'}`);
  $('#cSave').onclick = () => {
    const nom = $('#cNom').value.trim(); if(!nom){ $('#cNom').focus(); toast('Poné un nombre'); return; }
    c.nombre = nom;
    if(tj){ c.cierreDia = Math.min(31, Math.max(1, Number($('#cCierre').value) || 25)); c.vencDia = Math.min(31, Math.max(1, Number($('#cVenc').value) || 7)); }
    else {
      if(isNew) c.moneda = $('#cCur').value;
      const typed = $('#cSaldo').value.trim() === '' ? 0 : parseAmount($('#cSaldo').value);
      if(isNaN(typed)){ toast('Revisá el saldo'); return; }
      c.saldoInicial = isNew ? r2(typed) : r2(typed - (saldo(c) - (Number(c.saldoInicial) || 0)));
    }
    put('cuenta', c); recomputeMes(); closeSheet(); commit(); toast(isNew ? (tj ? 'Tarjeta agregada' : 'Cuenta agregada') : 'Cambios guardados');
  };
  if($('#cArch')) $('#cArch').onclick = () => { put('cuenta', {...c, activo:false}); closeSheet(); commit(); toast(tj ? 'Tarjeta quitada' : 'Cuenta quitada', () => { put('cuenta', {...c, activo:true}); commit(); }); };
}
function openTarjeta(id){
  const c = db.cuenta[id]; if(!c) return;
  const hoy = todayISO(), Ro = resumenDe(id, hoy);
  const Rs = [-2, -1, 0, 1, 2, 3].map(k => addMonthsYM(Ro, k));
  const futuros = Object.values(db.mov).some(m => m.cuenta === id && m.mes > addMonthsYM(Ro, 3));
  openSheet(`<h3>${esc(c.nombre)}</h3>
    <p class="k" style="margin:-6px 0 6px">Cada resumen junta lo que compraste hasta su cierre. Se cuenta como gasto en el mes en que vence.</p>
    <div id="resList">${Rs.map(R => {
      const r = resumenTarjeta(c, R);
      const estado = R < Ro ? (r.venc < hoy ? 'venció' : 'vence') : R === Ro ? 'en curso, vence' : 'vence';
      const tot = [money(r.ARS, 'ARS'), r.USD ? money(r.USD, 'USD') : ''].filter(Boolean).join(' + ');
      const pagado = r.pagos.ARS + r.pagos.USD;
      return `<div class="res" data-r="${R}">
        <div class="rh"><div><b>${mesNombre(R)} ${R.slice(0,4)}</b><small>Cierra ${diaMes(r.cierre)}, ${estado} ${diaMes(r.venc)}${r.manual ? ' (fechas marcadas)' : ''}</small>${pagado ? `<small style="color:var(--ok)">Pagaste ${[r.pagos.ARS ? money(r.pagos.ARS,'ARS') : '', r.pagos.USD ? money(r.pagos.USD,'USD') : ''].filter(Boolean).join(' + ')}</small>` : ''}</div><div class="tot num">${tot}</div></div>
        <div class="acts">
          ${r.items.length ? `<button data-a="ver">Ver ${r.items.length} consumo${r.items.length > 1 ? 's' : ''}</button>` : ''}
          <button data-a="fechas">Marcar fechas</button>
          ${R < Ro && (r.pagos.ARS < r.ARS - 0.004 || r.pagos.USD < r.USD - 0.004) ? '<button class="pri" data-a="pagar">Pagar</button>' : ''}
        </div>
        <div class="items" hidden>${r.items.map(m => `<div><span>${diaMes(m.fecha)} ${esc(m.nota || m.categoria)}${m.cuota ? ` (${esc(m.cuota)})` : ''}</span><span class="num">${money(m.monto, m.moneda)}</span></div>`).join('')}</div>
        <div class="fechas" hidden>
          <label>Cierre<input type="date" class="fc" value="${r.cierre}"></label>
          <label>Vencimiento<input type="date" class="fv" value="${r.venc}"></label>
          <button class="fs">Guardar</button>
        </div>
      </div>`;
    }).join('')}</div>
    ${futuros ? '<p class="note">Hay cuotas en resúmenes más adelante; las ves en la pestaña Mes.</p>' : ''}
    <div class="btns" style="margin-top:14px"><button class="btn ghost" id="tEdit">Cambiar nombre o días habituales</button></div>`);
  $$('#resList .res').forEach(el => {
    const R = el.dataset.r;
    el.querySelector('[data-a="ver"]')?.addEventListener('click', () => { const it = el.querySelector('.items'); it.hidden = !it.hidden; });
    el.querySelector('[data-a="fechas"]').onclick = () => { const f = el.querySelector('.fechas'); f.hidden = !f.hidden; };
    el.querySelector('.fs').onclick = () => {
      const ci = el.querySelector('.fc').value, ve = el.querySelector('.fv').value;
      if(!ci || !ve || ve < ci){ toast('El vencimiento tiene que ser después del cierre'); return; }
      put('cierre', {id:`${id}_${R}`, tarjeta:id, mes:R, cierre:ci, vencimiento:ve});
      const n = recomputeMes(); commit(); openTarjeta(id);
      toast(n ? `Fechas guardadas. ${n} consumo${n > 1 ? 's' : ''} cambiaron de resumen` : 'Fechas guardadas');
    };
    el.querySelector('[data-a="pagar"]')?.addEventListener('click', () => {
      const r = resumenTarjeta(c, R), deuda = r2(r.ARS - r.pagos.ARS);
      resetForm(); form.tipo = 'transferencia'; form.cur = 'ARS'; form.destino = id; form.cuenta = null;
      if(deuda > 0) form.amt = String(deuda).replace('.', ',');
      form.pagoR = R;
      closeSheet(); go('cargar');
      if(r.USD) toast(`Este resumen también tiene ${money(r.USD - r.pagos.USD, 'USD')}. Cargá ese pago aparte en USD.`);
    });
  });
  $('#tEdit').onclick = () => editCuenta(id);
}
function addDays(iso, n){ const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return isoOf(d); }

/* fijos */
function editFijo(id){
  const isNew = !id;
  const f = isNew ? {id:uid(), nombre:'', tipo:'gasto', monto:'', moneda:'ARS', categoria:catsGasto()[0], cuenta:'', dia:1, activo:true, desde:'', deben:'', etiquetas:''} : {...db.fijo[id]};
  const st = {list: debenDe(f), total: () => r2(parseAmount($('#fMonto')?.value)) || 0, cur: f.moneda};
  const draw = () => {
    const cats = f.tipo === 'gasto' ? catsGasto() : catsIngreso();
    if(!cats.includes(f.categoria)) f.categoria = cats[0];
    const accs = cuentasActivas().filter(c => (f.tipo === 'gasto' && c.clase === 'tarjeta') || (c.clase !== 'tarjeta' && c.moneda === f.moneda));
    if(!accs.some(c => c.id === f.cuenta)) f.cuenta = accs[0] ? accs[0].id : '';
    const dHoy = Number(todayISO().slice(8));
    st.cur = f.moneda;
    openSheet(`<h3>${isNew ? 'Nuevo fijo' : 'Editar fijo'}</h3>
      <div class="seg tipo" style="margin-bottom:14px" id="fTipo"><button data-v="gasto" aria-pressed="${f.tipo==='gasto'}">Gasto</button><button data-v="ingreso" aria-pressed="${f.tipo==='ingreso'}">Ingreso</button></div>
      <label class="f"><span>Nombre</span><input id="fNom" value="${esc(f.nombre)}" placeholder="Ej: Alquiler, Claude, Internet" autocomplete="off"></label>
      <div class="f2">
        <label class="f"><span>Monto</span><input id="fMonto" inputmode="decimal" value="${f.monto !== '' ? nf.format(f.monto) : ''}"></label>
        <label class="f"><span>Moneda</span><select id="fCur">${opts(['ARS','USD'], f.moneda)}</select></label>
      </div>
      <label class="f"><span>Categoría</span><select id="fCat">${opts(cats, f.categoria)}</select></label>
      <div class="f2">
        <label class="f"><span>${f.tipo === 'gasto' ? 'Con qué se paga' : 'Dónde entra'}</span><select id="fCuenta">${opts(accs.map(c => [c.id, c.nombre]), f.cuenta)}</select></label>
        <label class="f"><span>Día del mes</span><input id="fDia" type="number" inputmode="numeric" min="1" max="31" value="${f.dia}"></label>
      </div>
      ${f.tipo === 'gasto' ? '<h4>Compartido</h4><div class="deb" id="fDeb"></div>' : ''}
      ${isNew ? `<label class="check" id="fEsteRow"><input type="checkbox" id="fEste" checked> Cargar también el de este mes</label>`
              : `<label class="check"><input type="checkbox" id="fAct" ${f.activo?'checked':''}> Activo</label>`}
      <div class="btns">
        <button class="btn" id="fSave">${isNew ? 'Agregar fijo' : 'Guardar cambios'}</button>
        ${isNew ? '' : '<button class="btn danger" id="fDel">Borrar fijo</button>'}
      </div>`);
    const ed = $('#fDeb') ? debenEditor($('#fDeb'), st) : null;
    const grab = () => { f.nombre = $('#fNom').value; f.monto = $('#fMonto').value === '' ? '' : parseAmount($('#fMonto').value); f.moneda = $('#fCur').value; f.categoria = $('#fCat').value; f.cuenta = $('#fCuenta').value; f.dia = Number($('#fDia').value) || 1; };
    $$('#fTipo button').forEach(b => b.onclick = () => { grab(); f.tipo = b.dataset.v; draw(); });
    $('#fCur').onchange = () => { grab(); draw(); };
    $('#fMonto').addEventListener('input', () => $('#fDeb .dm')?.dispatchEvent(new Event('input')));
    const upd = () => { if(!isNew) return; const d = Number($('#fDia').value) || 1; $('#fEsteRow').style.display = d < dHoy ? '' : 'none'; };
    $('#fDia').oninput = upd; upd();
    $('#fSave').onclick = () => {
      grab();
      if(!f.nombre.trim()){ $('#fNom').focus(); toast('Poné un nombre'); return; }
      if(!(f.monto > 0)){ $('#fMonto').focus(); toast('Revisá el monto'); return; }
      if(!f.cuenta){ toast('Elegí una cuenta'); return; }
      if(ed && !ed.valid()){ toast('Revisá lo compartido'); return; }
      f.deben = f.tipo === 'gasto' && ed ? (ed.clean().length ? JSON.stringify(ed.clean()) : '') : '';
      f.dia = Math.min(31, Math.max(1, f.dia)); f.monto = r2(f.monto); f.nombre = f.nombre.trim();
      const cym = curYM();
      if(isNew){ const yaPaso = f.dia < Number(todayISO().slice(8)); f.desde = (yaPaso && !$('#fEste').checked) ? addMonthsYM(cym, 1) : cym; }
      else { const act = $('#fAct').checked; if(act && !f.activo) f.desde = cym; f.activo = act; }
      put('fijo', f); const g = genFijos(); closeSheet(); commit();
      toast(isNew ? (g ? 'Fijo agregado y cargado este mes' : 'Fijo agregado') : 'Cambios guardados');
    };
    if($('#fDel')) $('#fDel').onclick = () => { if(confirm('¿Borrar este fijo? Lo que ya se cargó queda.')){ del('fijo', f.id); closeSheet(); commit(); toast('Fijo borrado'); } };
  };
  draw();
}

/* =========================================================
   Vista: Me deben
   ========================================================= */
function renderDeben(){
  const by = deudores();
  const people = Object.entries(by).sort((a,b) => (b[1].ARS - a[1].ARS) || (b[1].USD - a[1].USD));
  const tARS = r2(people.reduce((s,[,d]) => s + d.ARS, 0)), tUSD = r2(people.reduce((s,[,d]) => s + d.USD, 0));
  const hist = Object.values(db.mov).filter(m => m.tipo === 'reintegro').sort((a,b) => b.fecha.localeCompare(a.fecha)).slice(0, 8);
  $('#v-deben').innerHTML = people.length ? `
    <div class="hero"><div class="k">Te deben en total</div>
      <div class="big num" style="margin-bottom:${tUSD ? 4 : 0}px">${money(tARS, 'ARS')}</div>
      ${tUSD ? `<div class="num" style="font-size:18px;font-weight:600">${money(tUSD, 'USD')}</div>` : ''}</div>
    <h2>Por persona</h2>
    ${people.map(([p, d]) => `<div class="per">
      <div class="h"><b>${esc(p)}</b><span class="tot num">${[d.ARS ? money(d.ARS,'ARS') : '', d.USD ? money(d.USD,'USD') : ''].filter(Boolean).join(' + ')}</span></div>
      ${d.items.sort((a,b) => a.mov.fecha.localeCompare(b.mov.fecha)).map(x => `<div class="it"><span>${diaMes(x.mov.fecha)} ${esc(x.mov.nota || x.mov.categoria)}${x.cobrado ? ` (ya pagó ${money(x.cobrado, x.moneda)})` : ''}</span><span class="num">${money(x.pend, x.moneda)}</span></div>`).join('')}
      <button class="cobrar" data-p="${esc(p)}">Registrar pago de ${esc(p)}</button>
    </div>`).join('')}
    ${hist.length ? `<h2>Últimos cobros</h2>${hist.map(m => `<button class="mov" data-id="${esc(m.id)}"><span class="dot reintegro"></span><span class="t"><b>${esc(m.persona)}</b><small>${esc(m.nota)}, ${diaMes(m.fecha)}, ${esc(nombreCuenta(m.cuenta))}</small></span><span class="a num reintegro">+${money(m.monto, m.moneda)}</span></button>`).join('')}` : ''}`
  : `<div class="empty-st">Nadie te debe nada.<br>Cuando cargues un gasto, tocá “Compartir” para anotar quién te tiene que pagar su parte.</div>
     ${hist.length ? `<h2>Últimos cobros</h2>${hist.map(m => `<button class="mov" data-id="${esc(m.id)}"><span class="dot reintegro"></span><span class="t"><b>${esc(m.persona)}</b><small>${esc(m.nota)}, ${diaMes(m.fecha)}</small></span><span class="a num reintegro">+${money(m.monto, m.moneda)}</span></button>`).join('')}` : ''}`;
  $$('#v-deben .cobrar').forEach(b => b.onclick = () => openCobro(b.dataset.p));
  $$('#v-deben .mov').forEach(b => b.onclick = () => editMov(b.dataset.id));
}
function openCobro(persona){
  const d = deudores()[persona]; if(!d) return;
  const curs = ['ARS','USD'].filter(c => d[c] > 0);
  let cur = curs[0];
  const draw = () => {
    const accs = cuentasActivas().filter(c => c.clase !== 'tarjeta' && c.moneda === cur);
    const last = load(`lauti.last.ingreso.${cur}`, null);
    openSheet(`<h3>Pago de ${esc(persona)}</h3>
      ${curs.length > 1 ? `<div class="seg" id="coCur" style="margin-bottom:14px">${curs.map(c => `<button data-v="${c}" aria-pressed="${c===cur}">${c === 'ARS' ? 'Pesos' : 'Dólares'}</button>`).join('')}</div>` : ''}
      <p class="k" style="margin:-4px 0 14px">Te debe ${money(d[cur], cur)}. Si paga menos, se descuenta de lo más viejo primero.</p>
      <label class="f"><span>Cuánto te pagó</span><input id="coM" inputmode="decimal" value="${nf.format(d[cur])}"></label>
      <div class="f2">
        <label class="f"><span>Dónde entró</span><select id="coA">${opts(accs.map(c => [c.id, c.nombre]), accs.some(c => c.id === last) ? last : accs[0]?.id)}</select></label>
        <label class="f"><span>Fecha</span><input id="coF" type="date" value="${todayISO()}"></label>
      </div>
      <div class="btns"><button class="btn" id="coOk">Registrar pago</button></div>`);
    $$('#coCur button').forEach(b => b.onclick = () => { cur = b.dataset.v; draw(); });
    $('#coOk').onclick = () => {
      const m = r2(parseAmount($('#coM').value));
      if(!(m > 0)){ toast('Revisá el monto'); return; }
      if(m > d[cur] + 0.004){ toast(`Te debe ${money(d[cur], cur)} como máximo`); return; }
      if(!$('#coA').value){ toast(`Necesitás una cuenta en ${cur}`); return; }
      const ids = registrarCobro({persona, moneda:cur, monto:m, cuenta:$('#coA').value, fecha:$('#coF').value || todayISO()});
      closeSheet(); commit(); toast(`Pago de ${persona} registrado`, () => { ids.forEach(i => del('mov', i)); commit(); });
    };
  };
  draw();
}

/* =========================================================
   Vista: Historial
   ========================================================= */
let histN = 6, histCur = 'ARS', histSel = null;
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function renderHist(){
  const end = curYM();
  const months = []; for(let i = histN - 1; i >= 0; i--) months.push(addMonthsYM(end, -i));
  const hasUSD = Object.values(db.mov).some(m => m.moneda === 'USD' && (m.tipo === 'gasto' || m.tipo === 'ingreso'));
  if(!hasUSD) histCur = 'ARS';
  const rows = months.map(ym => ({ym, ...totales(ym, histCur)}));
  if(!histSel || !months.includes(histSel)) histSel = end;
  const maxV = Math.max(1, ...rows.map(r => Math.max(r.ing, r.gas)));
  const step = niceStep(maxV / 3), top = Math.ceil(maxV / step) * step;
  const W = 340, H = 190, L = 34, R = 4, T = 8, B = 22, cw = (W - L - R) / months.length;
  const bw = Math.min(16, (cw - 10) / 2);
  const y = v => T + (H - T - B) * (1 - v / top);
  const bar = (x, v, c) => { if(v <= 0) return ''; const yy = y(v), h = H - B - yy, r = Math.min(4, h, bw/2);
    return `<path fill="var(--${c})" d="M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z"/>`; };
  let svg = '';
  for(let g = 0; g <= top + 1e-9; g += step){ const yy = y(g).toFixed(1); svg += `<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${(+yy+3).toFixed(1)}" text-anchor="end">${g ? compact(g) : '0'}</text>`; }
  rows.forEach((r, i) => {
    const x0 = L + i * cw, cx = x0 + cw / 2, sel = r.ym === histSel;
    if(sel) svg = `<rect class="selbg" x="${x0+2}" y="${T}" width="${cw-4}" height="${H-B-T}" rx="6"/>` + svg;
    svg += bar(cx - bw - 1, r.ing, 'in') + bar(cx + 1, r.gas, 'out');
    svg += `<text class="xl ${sel?'sel':''}" x="${cx}" y="${H-6}">${ymShort(r.ym)}</text>`;
    svg += `<rect class="hit" data-ym="${r.ym}" x="${x0}" y="0" width="${cw}" height="${H}"/>`;
  });
  const s = rows.find(r => r.ym === histSel);
  const anyData = rows.some(r => r.ing || r.gas);
  $('#v-hist').innerHTML = `
    <div class="mhead">
      <div class="seg" id="hN"><button data-v="6" aria-pressed="${histN===6}">6 meses</button><button data-v="12" aria-pressed="${histN===12}">12 meses</button></div>
      ${hasUSD ? `<div class="seg" id="hCur"><button data-v="ARS" aria-pressed="${histCur==='ARS'}">Pesos</button><button data-v="USD" aria-pressed="${histCur==='USD'}">Dólares</button></div>` : ''}
    </div>
    ${anyData ? `
    <div class="legend"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--out)"></i>Gastos (tu parte)</span></div>
    <div class="readout num"><span class="m">${ymLabel(s.ym)}</span><br>Ingresos <b>${money(s.ing, histCur)}</b>, gastos <b>${money(s.gas, histCur)}</b></div>
    <svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${svg}</svg>
    <h2>Mes a mes</h2>
    <table class="ht num"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Te queda</th></tr></thead><tbody>
    ${rows.slice().reverse().map((r, i, arr) => { const prev = arr[i+1]; let d = '';
      if(prev && prev.gas > 0 && r.gas > 0){ const p = Math.round((r.gas / prev.gas - 1) * 100); d = `<small class="${p>0?'up':p<0?'down':''}">${p>0?'+':''}${p}% vs ${ymShort(prev.ym)}</small>`; }
      return `<tr><td>${ymShort(r.ym)} ${r.ym.slice(2,4)}</td><td>${money(r.ing, histCur)}</td><td>${money(r.gas, histCur)}${d}</td><td class="${r.saldo<0?'neg':''}">${money(r.saldo, histCur)}</td></tr>`; }).join('')}
    </tbody></table>`
    : `<div class="empty-st">Todavía no hay movimientos para comparar. Cuando cargues gastos e ingresos vas a ver acá cómo cambian mes a mes.</div>`}`;
  $$('#hN button').forEach(b => b.onclick = () => { histN = Number(b.dataset.v); renderHist(); });
  $$('#hCur button').forEach(b => b.onclick = () => { histCur = b.dataset.v; renderHist(); });
  $$('#chart .hit').forEach(r => r.onclick = () => { histSel = r.dataset.ym; renderHist(); });
}

/* =========================================================
   Ajustes
   ========================================================= */
function openAjustes(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const last = db.lastSync ? new Date(db.lastSync) : null;
  openSheet(`<h3>Ajustes</h3>
    ${!standalone ? `<details class="help"><summary>Instalar en el iPhone</summary><ol><li>Abrí esta página en Safari.</li><li>Tocá el botón Compartir.</li><li>Elegí “Agregar a inicio”.</li></ol></details>` : ''}
    <label class="f"><span>Dirección del script de Google</span><input id="aUrl" value="${esc(conn.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="f"><span>Clave</span><input id="aTok" value="${esc(conn.token)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="status" id="aStatus">${db.syncErr ? `<span class="neg">Último error: ${esc(db.syncErr)}</span>` : last ? `Última sincronización: ${fechaCorta(isoOf(last)).toLowerCase()} a las ${pad2(last.getHours())}:${pad2(last.getMinutes())}.${db.queue.length ? ` ${db.queue.length} cambios sin subir.` : ''}` : 'Todavía no se conectó con la planilla.'}</div>
    <div class="btns" style="margin-bottom:8px"><button class="btn" id="aSync">Guardar y sincronizar</button>
      ${conn.url ? '<button class="btn ghost" id="aRebuild">Rehacer las pestañas de la planilla</button>' : ''}</div>
    <h4>Categorías</h4>
    <label class="f"><span>De gastos (una por renglón)</span><textarea id="aCG" style="min-height:220px">${esc(catsGasto().join('\n'))}</textarea></label>
    <label class="f"><span>De ingresos</span><textarea id="aCI" style="min-height:90px">${esc(catsIngreso().join('\n'))}</textarea></label>
    <div class="btns"><button class="btn ghost" id="aSave">Guardar categorías</button></div>`);
  const lines = el => [...new Set($(el).value.split('\n').map(s => s.trim()).filter(Boolean))];
  const st = $('#aStatus');
  $('#aSync').onclick = async () => {
    conn.url = $('#aUrl').value.trim(); conn.token = $('#aTok').value.trim(); store('lauti.conn', conn);
    st.className = 'status'; st.textContent = 'Conectando…';
    const r = await sync();
    if(r && r.ok){ st.textContent = `Conectado. ${Object.keys(db.mov).length} movimientos en la planilla.`; }
    else { st.className = 'status err'; st.textContent = (r && r.error) || 'No se pudo conectar'; }
  };
  if($('#aRebuild')) $('#aRebuild').onclick = async () => { st.className = 'status'; st.textContent = 'Rehaciendo pestañas…'; const r = await sync({rebuild:true}); st.textContent = r && r.ok ? 'Listo, pestañas actualizadas.' : ((r && r.error) || 'No se pudo conectar'); if(!(r && r.ok)) st.className = 'status err'; };
  $('#aSave').onclick = () => {
    const cg = lines('#aCG'), ci = lines('#aCI');
    if(!cg.length || !ci.length){ toast('Cada lista necesita al menos un renglón'); return; }
    setCfg('catsGasto', cg); setCfg('catsIngreso', ci); closeSheet(); commit(); toast('Categorías guardadas');
  };
}

/* =========================================================
   Arranque
   ========================================================= */
function renderBadge(){ const n = Object.keys(deudores()).length; const b = $('#badge'); b.hidden = !n; b.textContent = n; }
function renderAll(force){
  renderSync(); renderBadge();
  if(tab === 'cargar'){ const ae = document.activeElement; if(force || !$('#amt') || !ae || (ae.id !== 'nota' && ae.id !== 'amt2')) renderCargar(); }
  if(tab === 'mes') renderMes();
  if(tab === 'cuentas') renderCuentas();
  if(tab === 'deben') renderDeben();
  if(tab === 'hist') renderHist();
}
if(!conn.url) seed();
genFijos(); recomputeMes(); saveDB();
renderAll(true); sync();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
